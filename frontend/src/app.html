<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/logo-favicon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="%sveltekit.assets%/logo-64.png" />
    <link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D0B0A" />
    <meta
      name="description"
      content="Koryphaios — The Autonomous Workspace for 100% AI-Generated Code"
    />
    <title>Koryphaios</title>
    <script>
      /*
       * This guard is deliberately plain DOM code loaded before SvelteKit. If
       * Svelte itself cannot mount, a Svelte error boundary cannot render. Keep
       * this independent so native users get recovery controls instead of an
       * empty WebView.
       */
      (() => {
        const runtimeFailure = /(?:next_sibling_getter|first_child_getter|SvelteKit client error)/i;

        function diagnostic(reason, stack) {
          const userAgent = navigator.userAgent || 'Unknown runtime';
          return [
            'Koryphaios interface startup failure',
            `Time: ${new Date().toISOString()}`,
            `Reason: ${reason || 'Unknown client error'}`,
            `Runtime: ${userAgent}`,
            stack ? `\n${stack}` : '',
          ]
            .filter(Boolean)
            .join('\n');
        }

        function showFatalStartup(reason, stack) {
          if (!document.body || document.getElementById('kory-fatal-startup')) return;
          const report = diagnostic(reason, stack);
          const overlay = document.createElement('div');
          overlay.id = 'kory-fatal-startup';
          overlay.setAttribute('role', 'alert');
          overlay.setAttribute('aria-live', 'assertive');
          overlay.style.cssText = [
            'position:fixed',
            'inset:0',
            'z-index:2147483647',
            'display:flex',
            'align-items:center',
            'justify-content:center',
            'padding:24px',
            'background:var(--color-surface-0,#0d0b0a)',
            'color:var(--color-text-primary,#f4f0eb)',
            'font-family:system-ui,-apple-system,sans-serif',
          ].join(';');

          const card = document.createElement('div');
          card.style.cssText = [
            'width:min(560px,100%)',
            'padding:28px',
            'border-radius:18px',
            'border:1px solid var(--color-border,#403934)',
            'background:var(--color-surface-2,#191512)',
            'box-shadow:0 24px 80px rgba(0,0,0,.55)',
          ].join(';');

          const eyebrow = document.createElement('div');
          eyebrow.textContent = 'INTERFACE RECOVERY';
          eyebrow.style.cssText =
            'color:var(--color-warning,#f59e0b);font:700 11px/1.2 ui-monospace,monospace;letter-spacing:.14em';
          const title = document.createElement('h1');
          title.textContent = 'Koryphaios could not display the workspace';
          title.style.cssText = 'margin:12px 0 8px;font-size:20px;line-height:1.3';
          const message = document.createElement('p');
          message.textContent =
            'The interface failed before its normal recovery screen could load. Your project and session data were not changed.';
          message.style.cssText =
            'margin:0 0 20px;color:var(--color-text-secondary,#b7aea5);font-size:14px;line-height:1.55';

          const details = document.createElement('details');
          details.style.cssText =
            'margin-bottom:20px;border:1px solid var(--color-border,#403934);border-radius:10px;background:var(--color-surface-1,#12100e)';
          const summary = document.createElement('summary');
          summary.textContent = 'Technical details';
          summary.style.cssText =
            'cursor:pointer;padding:12px 14px;color:var(--color-text-secondary,#b7aea5);font-size:12px';
          const pre = document.createElement('pre');
          pre.textContent = report;
          pre.style.cssText =
            'max-height:220px;margin:0;padding:0 14px 14px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:var(--color-text-muted,#8f857c);font:11px/1.5 ui-monospace,monospace';
          details.append(summary, pre);

          const actions = document.createElement('div');
          actions.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end';
          const copy = document.createElement('button');
          copy.type = 'button';
          copy.textContent = 'Copy diagnostic';
          copy.style.cssText =
            'cursor:pointer;border:1px solid var(--color-border,#403934);border-radius:9px;padding:10px 14px;background:var(--color-surface-3,#241f1b);color:var(--color-text-primary,#f4f0eb);font-weight:600';
          copy.onclick = async () => {
            try {
              if (navigator.clipboard?.writeText) {
                await navigator.clipboard.writeText(report);
              } else {
                // Fallback for webviews without the async Clipboard API:
                // use a hidden textarea + execCommand('copy'), which works
                // everywhere including Tauri's WKWebView/WebKitGTK.
                const ta = document.createElement('textarea');
                ta.value = report;
                ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
              }
              copy.textContent = 'Copied';
            } catch (err) {
              console.warn(
                'Clipboard write failed:',
                err instanceof Error ? err.message : String(err),
              );
              details.open = true;
              copy.textContent = 'Select details to copy';
            }
          };
          const reload = document.createElement('button');
          reload.type = 'button';
          reload.textContent = 'Reload Koryphaios';
          reload.style.cssText =
            'cursor:pointer;border:1px solid var(--color-accent,#e0a44c);border-radius:9px;padding:10px 14px;background:var(--color-accent,#e0a44c);color:var(--color-surface-0,#0d0b0a);font-weight:700';
          reload.onclick = () => location.reload();
          actions.append(copy, reload);
          card.append(eyebrow, title, message, details, actions);
          overlay.append(card);
          document.body.append(overlay);
        }

        function considerFailure(reason, stack) {
          setTimeout(() => {
            const visibleText = document.body?.innerText?.trim() || '';
            if (runtimeFailure.test(reason || '') || visibleText.length === 0) {
              showFatalStartup(reason, stack);
            }
          }, 0);
        }

        window.addEventListener(
          'error',
          (event) => {
            considerFailure(event.message, event.error?.stack);
          },
          true,
        );
        window.addEventListener(
          'unhandledrejection',
          (event) => {
            const reason =
              event.reason instanceof Error ? event.reason.message : String(event.reason);
            const stack = event.reason instanceof Error ? event.reason.stack : '';
            considerFailure(reason, stack);
          },
          true,
        );

        window.__KORYPHAIOS_SHOW_FATAL_STARTUP__ = showFatalStartup;
      })();

      /*
       * Browser demos are real Koryphaios frontends backed by an in-memory
       * API. Route every normal localStorage call to sessionStorage before
       * the app modules evaluate so settings, themes, sessions, and composer
       * choices belong to this tab and disappear when it closes.
       */
      if (new URLSearchParams(location.search).has('demo') || location.hash.includes('demo')) {
        try {
          Object.defineProperty(window, 'localStorage', {
            configurable: true,
            value: window.sessionStorage,
          });
        } catch (err) {
          // Stores already tolerate unavailable browser storage.
          console.debug(
            'localStorage override failed:',
            err instanceof Error ? err.message : String(err),
          );
        }
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
