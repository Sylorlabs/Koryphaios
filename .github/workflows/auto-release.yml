name: Prepare Release

# A release is intentional: version files are prepared in source control first,
# then `/update` (or a manual dispatch) tags those exact bytes. This workflow
# never silently increments a version and never commits generated version bumps.
#
# GITHUB_TOKEN tag pushes do not start a second workflow automatically, so the
# desktop release workflow is dispatched explicitly on the new tag.

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact prepared version (for example 0.2.0). Must match the manifests.'
        required: false
        type: string

jobs:
  check-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Manual release preparation requested"
          elif printf '%s' "$COMMIT_MSG" | grep -q '/update'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "/update trigger detected"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No release trigger found"
          fi

      - name: Validate version alignment
        if: steps.check.outputs.should_release == 'true'
        env:
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          VERSION=${VERSION#v}
          REQUESTED=${REQUESTED_VERSION#v}

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid Tauri version: $VERSION"
            exit 1
          fi
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$VERSION" ]; then
            echo "::error::Requested version $REQUESTED does not match prepared version $VERSION"
            exit 1
          fi

          FAIL=0
          for pkg in package.json desktop/package.json backend/package.json frontend/package.json shared/package.json mcp-server/package.json; do
            [ -f "$pkg" ] || continue
            ACTUAL=$(jq -r .version "$pkg")
            if [ "$ACTUAL" != "$VERSION" ]; then
              echo "::error file=$pkg::Expected version $VERSION, found $ACTUAL"
              FAIL=1
            fi
          done

          CARGO_VERSION=$(awk '
            /^\[package\]/{in_package=1; next}
            /^\[/{if(in_package) exit}
            in_package && /^version = /{gsub(/version = |\"/, ""); print; exit}
          ' desktop/src-tauri/Cargo.toml)
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error file=desktop/src-tauri/Cargo.toml::Expected version $VERSION, found $CARGO_VERSION"
            FAIL=1
          fi

          for app_config in frontend/static/app.config.json config/app.config.json; do
            [ -f "$app_config" ] || continue
            APP_VERSION=$(jq -r .app.version "$app_config")
            if [ "$APP_VERSION" != "$VERSION" ]; then
              echo "::error file=$app_config::Expected version $VERSION, found $APP_VERSION"
              FAIL=1
            fi
          done

          [ "$FAIL" -eq 0 ] || exit 1
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Version releases are immutable."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Prepared release: $TAG"

      - name: Require a successful shell build for this commit
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHELL_PATHS=(
            desktop/src-tauri/Cargo.toml
            desktop/src-tauri/Cargo.lock
            desktop/src-tauri/src
            desktop/src-tauri/build.rs
            desktop/src-tauri/tauri.conf.json
            desktop/src-tauri/icons
            .github/workflows/build-shell.yml
          )
          for attempt in $(seq 1 50); do
            RUNS=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/build-shell.yml/runs" \
              -f status=success -f per_page=50)
            while IFS=$'\t' read -r RUN_ID SHELL_SHA; do
              if git merge-base --is-ancestor "$SHELL_SHA" "$GITHUB_SHA" && \
                git diff --quiet "$SHELL_SHA" "$GITHUB_SHA" -- "${SHELL_PATHS[@]}"; then
                echo "SHELL_BUILD_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
                echo "Pinned compatible shell build $RUN_ID at $SHELL_SHA"
                exit 0
              fi
            done < <(echo "$RUNS" | jq -r '.workflow_runs[] | [.id, .head_sha] | @tsv')

            CURRENT=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/build-shell.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f per_page=20)
            ACTIVE=$(echo "$CURRENT" | jq -r '[.workflow_runs[] | select(.status != "completed")] | length')
            FAILED=$(echo "$CURRENT" | jq -r '[.workflow_runs[] | select(.status == "completed" and .conclusion != "success")] | length')
            if [ "$ACTIVE" -eq 0 ] && [ "$FAILED" -gt 0 ]; then
              echo "::error::The shell build for $GITHUB_SHA failed; refusing to create $TAG"
              exit 1
            fi
            echo "Waiting for a compatible build-shell.yml run ($attempt/50)"
            sleep 60
          done
          echo "::error::No compatible successful shell build is available; refusing to create $TAG"
          exit 1

      - name: Tag exact prepared commit
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Dispatch desktop release on tag
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Dispatching release-desktop.yml on $TAG"
          gh workflow run release-desktop.yml --ref "$TAG"
          echo "Release workflow dispatched for $TAG"
