name: Auto Release

# Trigger a release by including "/update" in a commit message pushed to main/master.
# This workflow bumps the patch version (sourced from tauri.conf.json — the version
# the Tauri updater compares against), commits the bump, and pushes a v* tag.
# It then dispatches build-desktop.yml on that tag, which builds, signs, and
# publishes the release with latest.json (the Tauri updater manifest).
#
# NOTE: Pushes made with GITHUB_TOKEN do not trigger other workflow runs, so we
# explicitly dispatch build-desktop.yml via workflow_dispatch after tagging.

on:
  push:
    branches:
      - master
      - main

jobs:
  check-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for /update in commit message
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -q "/update"; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "🚀 /update trigger detected — will create release"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "No /update trigger found — skipping release"
          fi

      - name: Bump version and push tag
        if: steps.check.outputs.should_release == 'true'
        run: |
          # tauri.conf.json is the source of truth for the version the updater
          # compares against. Bump its patch version and sync to all version files.
          CURRENT=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          echo "Current version: $CURRENT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "New version: $NEW_VERSION"

          # tauri.conf.json
          jq ".version = \"$NEW_VERSION\"" desktop/src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp desktop/src-tauri/tauri.conf.json

          # Cargo.toml (only the package version line)
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW_VERSION\"/" desktop/src-tauri/Cargo.toml

          # Root package.json
          jq ".version = \"$NEW_VERSION\"" package.json > package.json.tmp
          mv package.json.tmp package.json

          # desktop/package.json
          jq ".version = \"$NEW_VERSION\"" desktop/package.json > desktop-pkg.tmp
          mv desktop-pkg.tmp desktop/package.json

          # Commit and tag
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json desktop/package.json desktop/src-tauri/Cargo.toml desktop/src-tauri/tauri.conf.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
          git push

          # Save the new version for the dispatch step
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Dispatch build-desktop.yml on the new tag
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN pushes don't trigger other workflows, so dispatch explicitly.
          # build-desktop.yml has workflow_dispatch in its triggers and will build,
          # sign, upload to the release, and generate latest.json.
          echo "Dispatching build-desktop.yml on tag v${NEW_VERSION}..."
          gh workflow run build-desktop.yml --ref "v${NEW_VERSION}"
          echo "Build workflow dispatched. Monitor at:"
          echo "https://github.com/Sylorlabs/Koryphaios/actions/workflows/build-desktop.yml"
