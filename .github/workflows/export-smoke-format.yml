name: Export Smoke Workflow Format

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/export-smoke-format.yml'
      - '.github/workflows/smoke-test.yml'

permissions:
  contents: read

jobs:
  export-smoke-workflow:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/provider-ui-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write .github/workflows/smoke-test.yml
      - run: |
          mkdir formatted-smoke
          cp .github/workflows/smoke-test.yml formatted-smoke/smoke-test.yml
      - uses: actions/upload-artifact@v7
        with:
          name: formatted-smoke-workflow
          path: formatted-smoke/
          if-no-files-found: error
          retention-days: 1
