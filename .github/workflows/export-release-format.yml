name: Export Release Workflow Format

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/export-release-format.yml'
      - '.github/workflows/release-desktop.yml'

permissions:
  contents: read

jobs:
  export-release-workflow:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/provider-ui-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write .github/workflows/release-desktop.yml
      - run: |
          mkdir formatted-release
          cp .github/workflows/release-desktop.yml formatted-release/release-desktop.yml
      - uses: actions/upload-artifact@v7
        with:
          name: formatted-release-workflow
          path: formatted-release/
          if-no-files-found: error
          retention-days: 1
