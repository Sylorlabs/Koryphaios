name: Format Hardening Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/format-hardening-branch.yml'
      - '.github/workflows/release-desktop.yml'
      - 'backend/src/providers/cline.ts'
      - 'frontend/src/lib/stores/theme.svelte.ts'
      - 'frontend/src/lib/theme-palette.test.ts'
      - 'shared/src/provider-support.ts'

permissions:
  contents: read

jobs:
  export-formatted-files:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/provider-ui-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Apply repository formatter
        run: |
          bunx prettier --write \
            .github/workflows/release-desktop.yml \
            backend/src/providers/cline.ts \
            frontend/src/lib/stores/theme.svelte.ts \
            frontend/src/lib/theme-palette.test.ts \
            shared/src/provider-support.ts

      - name: Stage formatted export
        run: |
          mkdir -p \
            formatted/.github/workflows \
            formatted/backend/src/providers \
            formatted/frontend/src/lib/stores \
            formatted/frontend/src/lib \
            formatted/shared/src
          cp .github/workflows/release-desktop.yml formatted/.github/workflows/
          cp backend/src/providers/cline.ts formatted/backend/src/providers/
          cp frontend/src/lib/stores/theme.svelte.ts formatted/frontend/src/lib/stores/
          cp frontend/src/lib/theme-palette.test.ts formatted/frontend/src/lib/
          cp shared/src/provider-support.ts formatted/shared/src/

      - uses: actions/upload-artifact@v7
        with:
          name: hardening-formatted-files
          path: formatted/
          if-no-files-found: error
          retention-days: 1
