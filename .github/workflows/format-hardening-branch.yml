name: Format Hardening Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/format-hardening-branch.yml'
      - 'backend/src/providers/cline.ts'

permissions:
  contents: write

jobs:
  format-cline:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/provider-ui-hardening' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Apply repository formatter
        run: bunx prettier --write backend/src/providers/cline.ts

      - name: Commit Cline formatting
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add backend/src/providers/cline.ts
          if git diff --cached --quiet; then
            echo 'No Cline formatting changes required'
            exit 0
          fi
          git commit -m 'style(cline): normalize adapter'
          git push origin HEAD:release/provider-ui-hardening
