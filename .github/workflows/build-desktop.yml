name: Build Desktop Apps

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  # Build for Windows
  build-windows:
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build
        env:
          BUILD_MODE: static
          NODE_ENV: production

      - name: Compile embedded backend payload
        shell: bash
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          TARGET="x86_64-pc-windows-msvc"
          OUTFILE="$GITHUB_WORKSPACE/desktop/src-tauri/embedded-backend/koryphaios-backend-${TARGET}.exe"
          mkdir -p "$(dirname "$OUTFILE")"
          # Bake the collaboration relay endpoint so shipped builds can host/join
          # out of the box (it's an endpoint, not a secret; the host secret stays
          # runtime-only). Overridable at dev time via the .env RELAY_URL.
          DEFINE=()
          [ -n "$RELAY_URL" ] && DEFINE+=(--define "process.env.RELAY_URL=\"$RELAY_URL\"")
          bun build --compile --target=bun-windows-x64 "${DEFINE[@]}" backend/src/server.ts --outfile="$OUTFILE"

      - name: Build Tauri app
        working-directory: ./desktop
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify Windows installer artifacts
        shell: pwsh
        run: |
          $msi = Get-ChildItem "desktop/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($msi.Count -lt 1 -or $nsis.Count -lt 1) {
            throw "Windows release requires both MSI and NSIS installer artifacts."
          }

          foreach ($installer in @($msi) + @($nsis)) {
            if ($installer.Length -lt 1MB) {
              throw "Installer is unexpectedly small: $($installer.FullName)"
            }
            $header = [System.IO.File]::ReadAllBytes($installer.FullName)[0..7]
            $isMsi = $installer.Extension -eq '.msi'
            $isValid = if ($isMsi) {
              # MSI uses the Compound File Binary header, not the PE `MZ` header.
              ($header[0..7] -join ',') -eq '208,207,17,224,161,177,26,225'
            } else {
              $header[0] -eq 0x4D -and $header[1] -eq 0x5A
            }
            if (-not $isValid) {
              throw "Installer header is invalid: $($installer.FullName)"
            }
            Write-Host "Validated $($installer.Name) ($($installer.Length) bytes)"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Build for macOS (Intel and Apple Silicon)
  build-macos:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
            bun-target: bun-darwin-x64
          - arch: aarch64
            target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build
        env:
          BUILD_MODE: static
          NODE_ENV: production

      - name: Compile embedded backend payload
        shell: bash
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          OUTFILE="$GITHUB_WORKSPACE/desktop/src-tauri/embedded-backend/koryphaios-backend-${{ matrix.target }}"
          mkdir -p "$(dirname "$OUTFILE")"
          DEFINE=()
          [ -n "$RELAY_URL" ] && DEFINE+=(--define "process.env.RELAY_URL=\"$RELAY_URL\"")
          bun build --compile --target=${{ matrix.bun-target }} "${DEFINE[@]}" backend/src/server.ts --outfile="$OUTFILE"

      - name: Build Tauri app (Universal Binary)
        working-directory: ./desktop
        run: |
          bun run tauri build --target ${{ matrix.target }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # `-` is Tauri's explicit ad-hoc signing identity. It is not an Apple
      # Developer ID and still requires a one-time Gatekeeper override, but it
      # keeps a browser-downloaded Apple Silicon app from being labelled
      # "damaged" solely because it has no code signature. A future
      # APPLE_SIGNING_IDENTITY secret overrides this value for full signing.
      - name: Verify macOS bundle code signature
        shell: bash
        run: |
          APP="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Koryphaios.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP"

      - name: Verify macOS DMG contains the signed app
        shell: bash
        run: |
          DMG=$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name "*.dmg" -print -quit)
          test -n "$DMG"
          MOUNT_DIR=$(mktemp -d)
          cleanup() {
            hdiutil detach "$MOUNT_DIR" -quiet 2>/dev/null || true
            rmdir "$MOUNT_DIR" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          MOUNTED_APP=$(find "$MOUNT_DIR" -maxdepth 1 -name "Koryphaios.app" -type d -print -quit)
          test -n "$MOUNTED_APP"
          codesign --verify --deep --strict --verbose=2 "$MOUNTED_APP"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts-${{ matrix.arch }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error

  # Build for Linux
  build-linux:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            bun-target: bun-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            desktop-file-utils \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build
        env:
          BUILD_MODE: static
          NODE_ENV: production

      - name: Compile embedded backend payload
        shell: bash
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          OUTFILE="$GITHUB_WORKSPACE/desktop/src-tauri/embedded-backend/koryphaios-backend-${{ matrix.target }}"
          mkdir -p "$(dirname "$OUTFILE")"
          DEFINE=()
          [ -n "$RELAY_URL" ] && DEFINE+=(--define "process.env.RELAY_URL=\"$RELAY_URL\"")
          bun build --compile --target=${{ matrix.bun-target }} "${DEFINE[@]}" backend/src/server.ts --outfile="$OUTFILE"

      - name: Build Tauri app
        working-directory: ./desktop
        run: bun run tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify Linux build produced expected artifacts
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          # Verify each Linux package format was produced.
          BUNDLE_DIR="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          DEB_COUNT=$(find "$BUNDLE_DIR/deb" -name "*.deb" 2>/dev/null | wc -l)
          RPM_COUNT=$(find "$BUNDLE_DIR/rpm" -name "*.rpm" 2>/dev/null | wc -l)
          APPIMAGE_COUNT=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" 2>/dev/null | wc -l)
          echo "Artifacts: deb=$DEB_COUNT rpm=$RPM_COUNT appimage=$APPIMAGE_COUNT"
          if [ "$DEB_COUNT" -eq 0 ] || [ "$RPM_COUNT" -eq 0 ] || [ "$APPIMAGE_COUNT" -eq 0 ]; then
            echo "ERROR: Linux release requires DEB, RPM, and AppImage artifacts"
            exit 1
          fi

          DEB=$(find "$BUNDLE_DIR/deb" -name "*.deb" -print -quit)
          RPM=$(find "$BUNDLE_DIR/rpm" -name "*.rpm" -print -quit)
          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" -print -quit)
          APPIMAGE=$(realpath "$APPIMAGE")

          test "$(dpkg-deb -f "$DEB" Package)" = "koryphaios"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "amd64"
          # Do not pipe package listings directly into grep: with `pipefail`,
          # grep may exit early and make dpkg-deb report a broken pipe.
          dpkg-deb --fsys-tarfile "$DEB" | tar -tf - > deb-contents.txt
          grep -qx 'usr/bin/koryphaios-desktop' deb-contents.txt
          grep -qx 'usr/share/applications/Koryphaios.desktop' deb-contents.txt
          grep -q '^usr/share/icons/.*/apps/koryphaios-desktop\.png$' deb-contents.txt
          dpkg-deb --fsys-tarfile "$DEB" | tar -xOf - usr/share/applications/Koryphaios.desktop > Koryphaios.desktop
          desktop-file-validate Koryphaios.desktop
          grep -qx 'Exec=koryphaios-desktop' Koryphaios.desktop

          rpm -qlp "$RPM" > rpm-contents.txt
          grep -qx '/usr/bin/koryphaios-desktop' rpm-contents.txt
          grep -qx '/usr/share/applications/Koryphaios.desktop' rpm-contents.txt
          grep -q '^/usr/share/icons/.*/apps/koryphaios-desktop\.png$' rpm-contents.txt

          # Hosted CI may not have a compatible AppImage runtime/FUSE setup.
          # Ensure the produced container is non-empty; the curl installer
          # restores its executable bit before real desktop launch.
          test -s "$APPIMAGE"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts-${{ matrix.arch }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Create universal macOS build (combines Intel and ARM)
  build-macos-universal:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 60
    needs: [build-macos]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: aarch64-apple-darwin

      - name: Add x86_64 target
        run: rustup target add x86_64-apple-darwin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build
        env:
          BUILD_MODE: static
          NODE_ENV: production

      - name: Compile universal embedded backend payload
        shell: bash
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          PAYLOAD_DIR="$GITHUB_WORKSPACE/desktop/src-tauri/embedded-backend"
          mkdir -p "$PAYLOAD_DIR"
          DEFINE=()
          [ -n "$RELAY_URL" ] && DEFINE+=(--define "process.env.RELAY_URL=\"$RELAY_URL\"")
          bun build --compile --target=bun-darwin-arm64 "${DEFINE[@]}" backend/src/server.ts --outfile="$PAYLOAD_DIR/koryphaios-backend-aarch64-apple-darwin"
          bun build --compile --target=bun-darwin-x64 "${DEFINE[@]}" backend/src/server.ts --outfile="$PAYLOAD_DIR/koryphaios-backend-x86_64-apple-darwin"

      - name: Build Universal Binary
        working-directory: ./desktop
        run: bun run tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify universal macOS bundle and DMG
        shell: bash
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          APP="$BUNDLE_DIR/macos/Koryphaios.app"
          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" -print -quit)
          test -d "$APP"
          test -n "$DMG"
          codesign --verify --deep --strict --verbose=2 "$APP"
          MOUNT_DIR=$(mktemp -d)
          cleanup() {
            hdiutil detach "$MOUNT_DIR" -quiet 2>/dev/null || true
            rmdir "$MOUNT_DIR" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          MOUNTED_APP=$(find "$MOUNT_DIR" -maxdepth 1 -name "Koryphaios.app" -type d -print -quit)
          test -n "$MOUNTED_APP"
          codesign --verify --deep --strict --verbose=2 "$MOUNTED_APP"

      - name: Upload Universal macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal-artifacts
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

  # Artifact builds run in parallel, but a single job owns release mutation.
  # This avoids concurrent GitHub release writes racing each other.
  publish-release:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [build-windows, build-macos, build-linux, build-macos-universal]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish verified installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' ASSETS < <(find release-artifacts -type f \( \
            -name '*.dmg' -o -name '*.dmg.sig' -o \
            -name '*.msi' -o -name '*.msi.sig' -o \
            -name '*.exe' -o -name '*.exe.sig' -o \
            -name '*.deb' -o -name '*.rpm' -o \
            -name '*.AppImage' -o -name '*.AppImage.sig' \
          \) -print0)
          test "${#ASSETS[@]}" -gt 0
          printf 'Publishing %s verified release assets\\n' "${#ASSETS[@]}"
          gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo Sylorlabs/Koryphaios

  # Generate and upload latest.json (Tauri updater manifest) from .sig files
  publish-updater-manifest:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [publish-release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate latest.json from release .sig files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          REPO="Sylorlabs/Koryphaios"
          VERSION="${TAG#v}"

          # Download all .sig files from the release
          mkdir -p sigs
          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir sigs || true

          # Initialize platforms JSON
          PLATFORMS='{}'

          for sig_file in sigs/*.sig; do
            [ -f "$sig_file" ] || continue
            sig_content=$(cat "$sig_file")
            base_name=$(basename "$sig_file" .sig)
            url="https://github.com/$REPO/releases/download/$TAG/$base_name"

            # Map filename patterns to Tauri platform keys
            platform=""
            case "$base_name" in
              *aarch64*.dmg)
                platform="darwin-aarch64" ;;
              *universal*.dmg)
                platform="darwin-universal" ;;
              *x86_64*.dmg|*x64*.dmg)
                platform="darwin-x86_64" ;;
              *aarch64*.AppImage|*arm64*.AppImage)
                platform="linux-aarch64" ;;
              *amd64*.AppImage|*x86_64*.AppImage)
                platform="linux-x86_64" ;;
              *x64-setup*.exe|*-setup*.exe)
                platform="windows-x86_64" ;;
              *)
                echo "::warning::Unknown platform for $base_name, skipping"
                continue ;;
            esac

            # For Windows, prefer NSIS .exe over MSI (skip .msi.sig if .exe.sig exists)
            if [[ "$platform" == "windows-x86_64" && "$base_name" == *.msi ]]; then
              if ls sigs/*-setup.exe.sig 1>/dev/null 2>&1; then
                echo "Skipping MSI signature (NSIS .exe preferred for Windows updates)"
                continue
              fi
            fi

            echo "Mapping: $base_name -> $platform"
            PLATFORMS=$(echo "$PLATFORMS" | jq \
              --arg p "$platform" \
              --arg s "$sig_content" \
              --arg u "$url" \
              '.[$p] = {signature: $s, url: $u}')
          done

          # Get release info for notes and date
          RELEASE_INFO=$(gh release view "$TAG" --repo "$REPO" --json body,createdAt)
          NOTES=$(echo "$RELEASE_INFO" | jq -r '.body // "Release $VERSION"')
          PUB_DATE=$(echo "$RELEASE_INFO" | jq -r '.createdAt')

          # Construct final latest.json
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" latest.json --clobber --repo Sylorlabs/Koryphaios

  # Summary job
  build-summary:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [build-windows, build-macos, build-linux, build-macos-universal]
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "Build Status Summary:"
          echo "===================="
          echo "Windows: ${{ needs.build-windows.result }}"
          echo "macOS: ${{ needs.build-macos.result }}"
          echo "macOS universal: ${{ needs.build-macos-universal.result }}"
          echo "Linux: ${{ needs.build-linux.result }}"

          if [ "${{ needs.build-windows.result }}" = "success" ] && \
             [ "${{ needs.build-macos.result }}" = "success" ] && \
             [ "${{ needs.build-macos-universal.result }}" = "success" ] && \
             [ "${{ needs.build-linux.result }}" = "success" ]; then
            echo "All builds succeeded!"
            exit 0
          else
            echo "Some builds failed!"
            exit 1
          fi
        shell: bash
