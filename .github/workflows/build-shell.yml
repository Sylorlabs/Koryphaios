name: Build Tauri Shell

# Builds the native Tauri shell binary (the Rust + WebView wrapper) on each
# target platform. This is the ONLY workflow that needs Windows/macOS runners.
#
# It runs rarely — only when the Rust shell code changes (desktop/src-tauri/**)
# or when manually triggered. The pre-built binaries are cached as GitHub
# Actions artifacts and downloaded by the release workflow.
#
# Most releases skip this entirely: they download the cached shell binary
# and inject new backend/frontend resources into the bundle.

on:
  push:
    branches: [master, main]
    paths:
      - 'desktop/src-tauri/Cargo.toml'
      - 'desktop/src-tauri/Cargo.lock'
      - 'desktop/src-tauri/src/**'
      - 'desktop/src-tauri/build.rs'
      - 'desktop/src-tauri/tauri.conf.json'
      - 'desktop/src-tauri/icons/**'
      - '.github/workflows/build-shell.yml'
  workflow_dispatch:

env:
  BUN_VERSION: '1.3.14'

permissions:
  contents: write

jobs:
  # ─── Build shell binary for each platform ──────────────────────────────────
  # The shell is a thin Rust + WebView wrapper (~1800 lines). It rarely changes.
  # We build it once per platform and cache the raw binary.

  build-shell-windows:
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: shell-windows-x64

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend (needed for tauri.conf.json resource resolution)
        working-directory: ./frontend
        run: bun run build
        env:
          BUILD_MODE: static
          NODE_ENV: production

      # Build the shell without the backend payload — the backend is injected
      # at release time as a Tauri resource. We create a dummy backend file so
      # the resource directory exists during bundling.
      - name: Create placeholder backend resource
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/embedded-backend
          # Placeholder — the real backend is injected at release time.
          echo "placeholder" > desktop/src-tauri/embedded-backend/koryphaios-backend-x86_64-pc-windows-msvc.exe

      - name: Build Tauri shell
        working-directory: ./desktop
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Extract shell binary
        shell: pwsh
        run: |
          $bin = Get-ChildItem "desktop/src-tauri/target/release/Koryphaios.exe" -ErrorAction Stop
          Copy-Item $bin.FullName "Koryphaios-shell-windows-x64.exe"
          Write-Host "Shell binary: $($bin.Length) bytes"

      - name: Upload shell binary
        uses: actions/upload-artifact@v7
        with:
          name: shell-windows-x64
          path: Koryphaios-shell-windows-x64.exe
          retention-days: 90

  build-shell-macos:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: aarch64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: shell-macos-${{ matrix.arch }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build
        env:
          BUILD_MODE: static
          NODE_ENV: production

      - name: Create placeholder backend resource
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/embedded-backend
          echo "placeholder" > "desktop/src-tauri/embedded-backend/koryphaios-backend-${{ matrix.target }}"

      - name: Build Tauri shell
        working-directory: ./desktop
        run: bun run tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Extract shell binary
        shell: bash
        run: |
          cp "desktop/src-tauri/target/${{ matrix.target }}/release/Koryphaios" \
             "Koryphaios-shell-macos-${{ matrix.arch }}"
          ls -la "Koryphaios-shell-macos-${{ matrix.arch }}"

      - name: Upload shell binary
        uses: actions/upload-artifact@v7
        with:
          name: shell-macos-${{ matrix.arch }}
          path: Koryphaios-shell-macos-${{ matrix.arch }}
          retention-days: 90

  build-shell-linux:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            desktop-file-utils \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: shell-linux-x64

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build
        env:
          BUILD_MODE: static
          NODE_ENV: production

      - name: Create placeholder backend resource
        run: |
          mkdir -p desktop/src-tauri/embedded-backend
          echo "placeholder" > desktop/src-tauri/embedded-backend/koryphaios-backend-x86_64-unknown-linux-gnu

      - name: Build Tauri shell
        working-directory: ./desktop
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Extract shell binary
        run: |
          cp desktop/src-tauri/target/release/Koryphaios Koryphaios-shell-linux-x64
          ls -la Koryphaios-shell-linux-x64

      - name: Upload shell binary
        uses: actions/upload-artifact@v7
        with:
          name: shell-linux-x64
          path: Koryphaios-shell-linux-x64
          retention-days: 90
