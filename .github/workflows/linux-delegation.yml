name: Linux delegation

# Focused Linux verification for cross-machine work. The full CI matrix covers
# the product; this job proves the delegation transport and the agent CLI on
# the platform most linked computers run.
on:
  push:
    branches: [master, main]
    paths:
      - 'backend/src/devices/**'
      - 'shared/src/compute-delegation.ts'
      - 'scripts/kory-cli.ts'
      - '.github/workflows/linux-delegation.yml'
  pull_request:
    paths:
      - 'backend/src/devices/**'
      - 'shared/src/compute-delegation.ts'
      - 'scripts/kory-cli.ts'
      - '.github/workflows/linux-delegation.yml'

env:
  BUN_VERSION: '1.3.14'

jobs:
  delegation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Delegated work transport tests
        run: bun test backend/src/devices/delegated-work.test.ts
      - name: Linked-device authority tests
        run: bun test backend/src/devices/device-authority.test.ts
      - name: Agent CLI smoke
        run: |
          bun scripts/kory-cli.ts help
          bun scripts/kory-cli.ts --json help
      - name: Backend typecheck
        run: bun run --filter backend typecheck
