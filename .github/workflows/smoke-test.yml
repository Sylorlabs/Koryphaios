name: Packaged App Smoke Test

# Download the exact draft installers, install them, launch the native app, and
# verify that the bundled backend becomes healthy. A release-workflow-triggered
# run promotes the draft only after Windows, macOS, and Linux all pass.
# Manual runs are diagnostic by default and promote only when explicitly asked.

on:
  workflow_run:
    workflows: ['Release Desktop Apps']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to smoke test (for example v0.2.0)'
        required: true
        type: string
      promote:
        description: 'Publish the draft after every packaged smoke job passes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_run: ${{ steps.resolve.outputs.should_run }}
      promote: ${{ steps.resolve.outputs.promote }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TAG: ${{ inputs.tag || '' }}
          MANUAL_PROMOTE: ${{ inputs.promote || false }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          SOURCE_REF: ${{ github.event.workflow_run.head_branch || '' }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          TAG=''
          PROMOTE=false

          if [ -n "$MANUAL_TAG" ]; then
            TAG="$MANUAL_TAG"
            PROMOTE="$MANUAL_PROMOTE"
          elif [ "$SOURCE_CONCLUSION" = "success" ]; then
            TAG="$SOURCE_REF"
            PROMOTE=true
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "Source release workflow did not succeed; smoke test will not run"
            exit 0
          fi

          # workflow_run normally reports the release tag as head_branch. Keep a
          # deterministic API fallback for platforms that report only a SHA.
          case "$TAG" in
            v*) ;;
            *)
              TAG=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate \
                --jq '.[] | [.ref, .object.type, .object.sha] | @tsv' | \
                while IFS=$'\t' read -r REF TYPE SHA; do
                  RESOLVED_SHA="$SHA"
                  if [ "$TYPE" = "tag" ]; then
                    RESOLVED_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq .object.sha)
                  fi
                  if [ "$RESOLVED_SHA" = "$SOURCE_SHA" ]; then
                    printf '%s\n' "${REF#refs/tags/}"
                    break
                  fi
                done)
              ;;
          esac

          case "$TAG" in
            v*) ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "promote=false" >> "$GITHUB_OUTPUT"
              echo "Resolved source '$TAG' is not a release tag"
              exit 0
              ;;
          esac

          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$IS_DRAFT" != "true" ] && [ "$PROMOTE" = "true" ]; then
            echo "::error::Automated smoke expected draft $TAG, but it is already public"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "promote=$PROMOTE" >> "$GITHUB_OUTPUT"

  smoke-windows:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.should_run == 'true'
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 12
    steps:
      - name: Download Windows installer from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        shell: pwsh
        run: |
          gh release download "$env:TAG" --repo "$env:GITHUB_REPOSITORY" `
            --pattern "*x64-setup.exe" --dir . --clobber
          $exe = Get-ChildItem "*-x64-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "No Windows installer found in release $env:TAG" }
          if ($exe.Length -lt 1MB) { throw "Windows installer is unexpectedly small" }
          "INSTALLER_PATH=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Install silently
        shell: pwsh
        run: |
          $installDir = "$env:LOCALAPPDATA\Koryphaios"
          Start-Process -FilePath "$env:INSTALLER_PATH" -ArgumentList "/S","/D=$installDir" -Wait -NoNewWindow
          $appExe = Join-Path $installDir "Koryphaios.exe"
          if (-not (Test-Path $appExe)) { throw "Koryphaios.exe not found after install" }
          "APP_EXE=$appExe" >> $env:GITHUB_ENV

      - name: Launch app and verify bundled backend
        shell: pwsh
        run: |
          $dataDir = "$env:LOCALAPPDATA\com.sylorlabs.koryphaios"
          $activePortFile = Join-Path $dataDir ".koryphaios\.active-port.json"
          $proc = Start-Process -FilePath "$env:APP_EXE" -PassThru
          "APP_PID=$($proc.Id)" >> $env:GITHUB_ENV

          $healthy = $false
          $port = 3001
          for ($elapsed = 0; $elapsed -lt 90; $elapsed += 2) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { throw "App exited with code $($proc.ExitCode) after ${elapsed}s" }
            if (Test-Path $activePortFile) {
              try {
                $portInfo = Get-Content $activePortFile -Raw | ConvertFrom-Json
                if ($portInfo.port) { $port = $portInfo.port }
              } catch {}
            }
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" `
                -TimeoutSec 3 -UseBasicParsing -ErrorAction Stop
              $body = $response.Content | ConvertFrom-Json
              if ($body.ok -eq $true) {
                Write-Host "Bundled backend healthy on port $port"
                $healthy = $true
                break
              }
            } catch {}
          }
          if (-not $healthy) { throw "Bundled backend did not become healthy" }

      - name: Capture packaged-app evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke-evidence | Out-Null
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("smoke-evidence/windows-packaged-app.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
          } catch {
            "Screenshot unavailable: $($_.Exception.Message)" | Out-File smoke-evidence/screenshot-error.txt
          }
          $logDir = "$env:LOCALAPPDATA\com.sylorlabs.koryphaios\logs"
          if (Test-Path $logDir) { Copy-Item "$logDir\*" smoke-evidence -Recurse -Force -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-evidence-windows
          path: smoke-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name "Koryphaios" -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process -Name "koryphaios-backend-*" -ErrorAction SilentlyContinue | Stop-Process -Force

  smoke-macos:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.should_run == 'true'
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 12
    steps:
      - name: Download universal macOS DMG from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*universal*.dmg' --dir . --clobber
          DMG=$(find . -maxdepth 1 -name '*universal*.dmg' -print -quit)
          test -s "$DMG"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Mount, verify, and install
        run: |
          set -euo pipefail
          MOUNT_POINT=$(hdiutil attach "$DMG_PATH" -nobrowse -quiet | tail -1 | cut -f3)
          APP=$(find "$MOUNT_POINT" -maxdepth 1 -name "Koryphaios.app" -type d -print -quit)
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          rm -rf /Applications/Koryphaios.app
          cp -R "$APP" /Applications/
          # Never strip quarantine attributes. CI downloads usually lack browser
          # quarantine, but a present trust boundary must not be bypassed.
          hdiutil detach "$MOUNT_POINT" -quiet

      - name: Launch app and verify bundled backend
        run: |
          set -euo pipefail
          DATA_DIR="$HOME/Library/Application Support/com.sylorlabs.koryphaios"
          ACTIVE_PORT="$DATA_DIR/.koryphaios/.active-port.json"
          PORT=3001
          open /Applications/Koryphaios.app
          sleep 3
          APP_PID=$(pgrep -f "Koryphaios.app/Contents/MacOS/Koryphaios" | head -1)
          test -n "$APP_PID"
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"

          HEALTHY=false
          for ELAPSED in $(seq 2 2 90); do
            sleep 2
            kill -0 "$APP_PID" 2>/dev/null || { echo "App exited after ${ELAPSED}s"; exit 1; }
            if [ -f "$ACTIVE_PORT" ]; then
              PORT=$(python3 -c "import json; print(json.load(open('$ACTIVE_PORT')).get('port', 3001))" 2>/dev/null || echo 3001)
            fi
            RESPONSE=$(curl -s --max-time 3 "http://127.0.0.1:$PORT/api/health" || true)
            if [ -n "$RESPONSE" ] && [ "$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("ok", False))' 2>/dev/null || echo False)" = "True" ]; then
              echo "Bundled backend healthy on port $PORT"
              HEALTHY=true
              break
            fi
          done
          [ "$HEALTHY" = "true" ]

      - name: Capture packaged-app evidence
        if: always()
        run: |
          mkdir -p smoke-evidence
          screencapture -x smoke-evidence/macos-universal-packaged-app.png || true
          LOG_DIR="$HOME/Library/Application Support/com.sylorlabs.koryphaios/logs"
          [ ! -d "$LOG_DIR" ] || cp -R "$LOG_DIR" smoke-evidence/logs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-evidence-macos-universal
          path: smoke-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          pkill -f "Koryphaios.app/Contents/MacOS/Koryphaios" 2>/dev/null || true
          pkill -f "koryphaios-backend" 2>/dev/null || true

  smoke-linux:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.should_run == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Install packaged-runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl xvfb libfuse2 libwebkit2gtk-4.1-0 libgtk-3-0 \
            libayatana-appindicator3-1

      - name: Download Linux AppImage from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.AppImage' --dir . --clobber
          APPIMAGE=$(find . -maxdepth 1 -name '*.AppImage' -print -quit)
          test -s "$APPIMAGE"
          chmod +x "$APPIMAGE"
          echo "APPIMAGE=$APPIMAGE" >> "$GITHUB_ENV"

      - name: Launch AppImage and verify bundled backend
        run: |
          set -euo pipefail
          mkdir -p smoke-evidence
          DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/com.sylorlabs.koryphaios"
          ACTIVE_PORT="$DATA_DIR/.koryphaios/.active-port.json"
          PORT=3001
          APPIMAGE_EXTRACT_AND_RUN=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            xvfb-run -a "$APPIMAGE" >smoke-evidence/appimage.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"

          HEALTHY=false
          for ELAPSED in $(seq 2 2 100); do
            sleep 2
            kill -0 "$APP_PID" 2>/dev/null || { cat smoke-evidence/appimage.log; exit 1; }
            if [ -f "$ACTIVE_PORT" ]; then
              PORT=$(python3 -c "import json; print(json.load(open('$ACTIVE_PORT')).get('port', 3001))" 2>/dev/null || echo 3001)
            fi
            RESPONSE=$(curl -s --max-time 3 "http://127.0.0.1:$PORT/api/health" || true)
            if [ -n "$RESPONSE" ] && [ "$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("ok", False))' 2>/dev/null || echo False)" = "True" ]; then
              echo "Bundled backend healthy on port $PORT"
              HEALTHY=true
              break
            fi
          done
          [ "$HEALTHY" = "true" ]

      - name: Capture packaged-app logs
        if: always()
        run: |
          mkdir -p smoke-evidence
          LOG_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/com.sylorlabs.koryphaios/logs"
          [ ! -d "$LOG_DIR" ] || cp -R "$LOG_DIR" smoke-evidence/logs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-evidence-linux-appimage
          path: smoke-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          [ -z "${APP_PID:-}" ] || kill "$APP_PID" 2>/dev/null || true
          pkill -f "koryphaios-backend" 2>/dev/null || true

  smoke-summary:
    needs: [resolve-tag, smoke-windows, smoke-macos, smoke-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate packaged smoke results
        run: |
          if [ "${{ needs.resolve-tag.outputs.should_run }}" != "true" ]; then
            echo "Packaged smoke test was intentionally skipped"
            exit 0
          fi
          echo "Packaged smoke results for ${{ needs.resolve-tag.outputs.tag }}"
          echo "Windows: ${{ needs.smoke-windows.result }}"
          echo "macOS:   ${{ needs.smoke-macos.result }}"
          echo "Linux:   ${{ needs.smoke-linux.result }}"
          if [ "${{ needs.smoke-windows.result }}" != "success" ] || \
             [ "${{ needs.smoke-macos.result }}" != "success" ] || \
             [ "${{ needs.smoke-linux.result }}" != "success" ]; then
            echo "::error::At least one packaged desktop smoke test failed; release remains draft"
            exit 1
          fi

  promote-release:
    needs: [resolve-tag, smoke-summary]
    if: >-
      needs.resolve-tag.outputs.should_run == 'true' &&
      needs.resolve-tag.outputs.promote == 'true' &&
      needs.smoke-summary.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote verified draft to stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [ "$IS_DRAFT" = "true" ]
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx false
          echo "Published $TAG after Windows, macOS, and Linux packaged smoke tests passed"

  upgrade-windows:
    needs: [resolve-tag, promote-release]
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - name: Install v0.1.0 and inject the upgrade driver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release download v0.1.0 --repo "$env:GITHUB_REPOSITORY" `
            --pattern "Koryphaios_0.1.0_x64-setup.exe" --dir . --clobber
          $installer = (Get-Item "Koryphaios_0.1.0_x64-setup.exe").FullName
          $installDir = "$env:LOCALAPPDATA\Koryphaios"
          Start-Process -FilePath $installer -ArgumentList "/S","/D=$installDir" -Wait
          $index = Join-Path $installDir "frontend\index.html"
          if (-not (Test-Path $index)) { throw "Packaged frontend index not found" }
          $driver = 'setTimeout(async()=>{try{const r=await window.__TAURI_INTERNALS__.invoke("check_for_updates");if(r.available)await window.__TAURI_INTERNALS__.invoke("install_update")}catch(e){document.title="UPDATE_TEST_FAILED:"+e}},5000)'
          Set-Content (Join-Path $installDir "frontend\upgrade-driver.js") $driver -NoNewline
          (Get-Content $index -Raw).Replace('</head>', '<script src="/upgrade-driver.js"></script></head>') | Set-Content $index -NoNewline
          "APP_EXE=$installDir\Koryphaios.exe" >> $env:GITHUB_ENV

      - name: Discover, install, relaunch, and verify the candidate
        env:
          EXPECTED_VERSION: ${{ needs.resolve-tag.outputs.tag }}
        shell: pwsh
        run: |
          $expected = $env:EXPECTED_VERSION.TrimStart('v')
          $dataDir = "$env:LOCALAPPDATA\com.sylorlabs.koryphaios"
          $activePortFile = Join-Path $dataDir ".koryphaios\.active-port.json"
          Start-Process -FilePath $env:APP_EXE | Out-Null
          for ($elapsed = 0; $elapsed -lt 1500; $elapsed += 5) {
            Start-Sleep -Seconds 5
            if (-not (Test-Path $activePortFile)) { continue }
            try {
              $port = (Get-Content $activePortFile -Raw | ConvertFrom-Json).port
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 3
              if ($health.data.version -eq $expected) {
                Write-Host "Verified packaged upgrade to $expected"
                exit 0
              }
            } catch {}
          }
          throw "v0.1.0 did not upgrade and relaunch as $expected"

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name "Koryphaios" -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process -Name "koryphaios-backend-*" -ErrorAction SilentlyContinue | Stop-Process -Force

  upgrade-macos:
    needs: [resolve-tag, promote-release]
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 30
    steps:
      - name: Install v0.1.0 and inject the upgrade driver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then OLD_DMG='Koryphaios_0.1.0_aarch64.dmg'; else OLD_DMG='Koryphaios_0.1.0_x64.dmg'; fi
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern "$OLD_DMG" --dir . --clobber
          MOUNT_POINT=$(hdiutil attach "$OLD_DMG" -nobrowse -quiet | tail -1 | cut -f3)
          rm -rf /Applications/Koryphaios.app
          cp -R "$MOUNT_POINT/Koryphaios.app" /Applications/
          hdiutil detach "$MOUNT_POINT" -quiet
          INDEX=/Applications/Koryphaios.app/Contents/Resources/frontend/index.html
          test -f "$INDEX"
          python3 - "$INDEX" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          driver = 'setTimeout(async()=>{try{const r=await window.__TAURI_INTERNALS__.invoke("check_for_updates");if(r.available)await window.__TAURI_INTERNALS__.invoke("install_update")}catch(e){document.title="UPDATE_TEST_FAILED:"+e}},5000)'
          path.with_name('upgrade-driver.js').write_text(driver)
          path.write_text(path.read_text().replace('</head>', '<script src="/upgrade-driver.js"></script></head>'))
          PY
          codesign --force --deep --sign - /Applications/Koryphaios.app

      - name: Discover, install, relaunch, and verify the candidate
        env:
          EXPECTED_VERSION: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION=${EXPECTED_VERSION#v}
          ACTIVE_PORT="$HOME/Library/Application Support/com.sylorlabs.koryphaios/.koryphaios/.active-port.json"
          open /Applications/Koryphaios.app
          for ELAPSED in $(seq 5 5 1500); do
            sleep 5
            [ -f "$ACTIVE_PORT" ] || continue
            PORT=$(python3 -c "import json; print(json.load(open('$ACTIVE_PORT')).get('port', 3001))" 2>/dev/null || echo 3001)
            VERSION=$(curl -fsS --max-time 3 "http://127.0.0.1:$PORT/api/health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["version"])' 2>/dev/null || true)
            if [ "$VERSION" = "$EXPECTED_VERSION" ]; then
              echo "Verified packaged upgrade to $EXPECTED_VERSION"
              exit 0
            fi
          done
          echo "v0.1.0 did not upgrade and relaunch as $EXPECTED_VERSION"
          exit 1

      - name: Cleanup
        if: always()
        run: |
          pkill -f "Koryphaios.app/Contents/MacOS/Koryphaios" 2>/dev/null || true
          pkill -f "koryphaios-backend" 2>/dev/null || true

  upgrade-linux-appimage:
    needs: [resolve-tag, promote-release]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - name: Repack v0.1.0 AppImage with the upgrade driver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xvfb squashfs-tools libfuse2 libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Koryphaios_0.1.0_amd64.AppImage' --dir . --clobber
          chmod +x Koryphaios_0.1.0_amd64.AppImage
          ./Koryphaios_0.1.0_amd64.AppImage --appimage-extract >/dev/null
          python3 <<'PY'
          import pathlib
          path = pathlib.Path('squashfs-root/usr/lib/Koryphaios/frontend/index.html')
          driver = 'setTimeout(async()=>{try{const r=await window.__TAURI_INTERNALS__.invoke("check_for_updates");if(r.available)await window.__TAURI_INTERNALS__.invoke("install_update")}catch(e){document.title="UPDATE_TEST_FAILED:"+e}},5000)'
          path.with_name('upgrade-driver.js').write_text(driver)
          path.write_text(path.read_text().replace('</head>', '<script src="/upgrade-driver.js"></script></head>'))
          PY
          OFFSET=$(./Koryphaios_0.1.0_amd64.AppImage --appimage-offset)
          head -c "$OFFSET" Koryphaios_0.1.0_amd64.AppImage > appimage-runtime
          mksquashfs squashfs-root appimage-payload.squashfs \
            -comp zstd -b 1M -noappend -all-root >/dev/null
          cat appimage-runtime appimage-payload.squashfs > Koryphaios-upgrade-test.AppImage
          chmod +x Koryphaios-upgrade-test.AppImage

      - name: Discover, install, relaunch, and verify the candidate
        env:
          EXPECTED_VERSION: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION=${EXPECTED_VERSION#v}
          ACTIVE_PORT="${XDG_DATA_HOME:-$HOME/.local/share}/com.sylorlabs.koryphaios/.koryphaios/.active-port.json"
          WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a ./Koryphaios-upgrade-test.AppImage >upgrade.log 2>&1 &
          for ELAPSED in $(seq 5 5 1800); do
            sleep 5
            [ -f "$ACTIVE_PORT" ] || continue
            PORT=$(python3 -c "import json; print(json.load(open('$ACTIVE_PORT')).get('port', 3001))" 2>/dev/null || echo 3001)
            VERSION=$(curl -fsS --max-time 3 "http://127.0.0.1:$PORT/api/health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["version"])' 2>/dev/null || true)
            if [ "$VERSION" = "$EXPECTED_VERSION" ]; then
              echo "Verified packaged AppImage upgrade to $EXPECTED_VERSION"
              exit 0
            fi
          done
          cat upgrade.log
          exit 1

      - name: Cleanup
        if: always()
        run: |
          pkill -f Koryphaios 2>/dev/null || true
          pkill -f koryphaios-backend 2>/dev/null || true

  upgrade-linux-deb:
    needs: [resolve-tag, promote-release]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Install dependencies and v0.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xvfb libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Koryphaios_0.1.0_amd64.deb' --dir . --clobber
          sudo dpkg -i Koryphaios_0.1.0_amd64.deb
          PACKAGE_NAME=$(dpkg-deb -f Koryphaios_0.1.0_amd64.deb Package)
          INDEX=$(dpkg -L "$PACKAGE_NAME" | awk '/\/frontend\/index.html$/ { print; exit }')
          APP_EXE=$(dpkg -L "$PACKAGE_NAME" | awk '/\/(Koryphaios|koryphaios)$/ { print; exit }')
          test -f "$INDEX"
          test -x "$APP_EXE"
          sudo python3 - "$INDEX" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          driver = 'setTimeout(async()=>{try{const r=await window.__TAURI_INTERNALS__.invoke("check_for_updates");if(r.available)await window.__TAURI_INTERNALS__.invoke("install_update")}catch(e){document.title="UPDATE_TEST_FAILED:"+e}},5000)'
          path.with_name('upgrade-driver.js').write_text(driver)
          path.write_text(path.read_text().replace('</head>', '<script src="/upgrade-driver.js"></script></head>'))
          PY
          echo "APP_EXE=$APP_EXE" >> "$GITHUB_ENV"

      - name: Discover, install, relaunch, and verify the candidate
        env:
          EXPECTED_VERSION: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION=${EXPECTED_VERSION#v}
          ACTIVE_PORT="${XDG_DATA_HOME:-$HOME/.local/share}/com.sylorlabs.koryphaios/.koryphaios/.active-port.json"
          WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a "$APP_EXE" >upgrade.log 2>&1 &
          for ELAPSED in $(seq 5 5 1500); do
            sleep 5
            [ -f "$ACTIVE_PORT" ] || continue
            PORT=$(python3 -c "import json; print(json.load(open('$ACTIVE_PORT')).get('port', 3001))" 2>/dev/null || echo 3001)
            VERSION=$(curl -fsS --max-time 3 "http://127.0.0.1:$PORT/api/health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["version"])' 2>/dev/null || true)
            if [ "$VERSION" = "$EXPECTED_VERSION" ]; then
              echo "Verified packaged DEB upgrade to $EXPECTED_VERSION"
              exit 0
            fi
          done
          cat upgrade.log
          exit 1

      - name: Cleanup
        if: always()
        run: |
          pkill -f Koryphaios 2>/dev/null || true
          pkill -f koryphaios-backend 2>/dev/null || true
