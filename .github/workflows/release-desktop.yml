name: Release Desktop Apps

# Assembles desktop installers from pre-built Tauri shell binaries + new
# backend/frontend resources. This runs on EVERY release tag.
#
# Architecture:
#   1. Build frontend once (Linux, platform-independent)
#   2. Cross-compile Bun backend for all 4 targets (Linux, no native runners)
#   3. Download pre-built shell binaries from the build-shell workflow
#   4. Assemble bundles:
#      - Linux: tauri build (native, fast — shell is cached)
#      - Windows: NSIS installer via makensis on Linux (no Windows runner!)
#      - macOS: .app + DMG + codesign on macOS (no Rust compilation!)
#   5. Sign, upload, publish release + updater manifest
#
# The macOS job is the ONLY one that needs a macOS runner, and it does NO
# Rust compilation — just file assembly + codesign + hdiutil. ~2 minutes
# instead of 30+ minutes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BUN_VERSION: '1.3.14'

permissions:
  contents: write

jobs:
  # ─── Build frontend (once, platform-independent) ───────────────────────────
  build-frontend:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build
        env:
          BUILD_MODE: static
          NODE_ENV: production

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build/client
          if-no-files-found: error
          retention-days: 1

  # ─── Cross-compile backend for all targets (Linux only) ────────────────────
  build-backends:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [build-frontend]
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            bun-target: bun-windows-x64
            suffix: .exe
          - target: x86_64-apple-darwin
            bun-target: bun-darwin-x64
            suffix: ''
          - target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
            suffix: ''
          - target: x86_64-unknown-linux-gnu
            bun-target: bun-linux-x64
            suffix: ''
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile backend for ${{ matrix.target }}
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          OUTFILE="$GITHUB_WORKSPACE/koryphaios-backend-${{ matrix.target }}${{ matrix.suffix }}"
          DEFINE=()
          [ -n "$RELAY_URL" ] && DEFINE+=(--define "process.env.RELAY_URL=\"$RELAY_URL\"")
          bun build --compile --target=${{ matrix.bun-target }} "${DEFINE[@]}" \
            backend/src/server.ts --outfile="$OUTFILE"
          ls -la "$OUTFILE"

      - uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.target }}
          path: koryphaios-backend-${{ matrix.target }}${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 1

  # ─── Download pre-built shell binaries ─────────────────────────────────────
  download-shells:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      shell-available: ${{ steps.check.outputs.available }}
    steps:
      - name: Download shell artifacts from latest build-shell run
        uses: actions/download-artifact@v4
        with:
          name: shell-windows-x64
          path: shells/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ vars.SHELL_BUILD_RUN_ID || '' }}
        continue-on-error: true
        id: dl-windows

      - name: Download macOS x86_64 shell
        uses: actions/download-artifact@v4
        with:
          name: shell-macos-x86_64
          path: shells/macos-x86_64
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        id: dl-macos-x64

      - name: Download macOS aarch64 shell
        uses: actions/download-artifact@v4
        with:
          name: shell-macos-aarch64
          path: shells/macos-aarch64
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        id: dl-macos-arm64

      - name: Download Linux shell
        uses: actions/download-artifact@v4
        with:
          name: shell-linux-x64
          path: shells/linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        id: dl-linux

      - name: Check shell availability
        id: check
        run: |
          AVAILABLE="true"
          for dir in shells/windows shells/macos-x86_64 shells/macos-aarch64 shells/linux; do
            if [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "WARNING: No shell binary found in $dir"
              AVAILABLE="false"
            fi
          done
          echo "available=$AVAILABLE" >> $GITHUB_OUTPUT
          echo "Shell availability: $AVAILABLE"

      - name: Upload all shells as combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: shell-binaries
          path: shells/
          retention-days: 1

  # ─── Assemble Windows installer (Linux, no Windows runner!) ────────────────
  assemble-windows:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: [build-frontend, build-backends, download-shells]
    if: needs.download-shells.outputs.shell-available == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install NSIS
        run: sudo apt-get install -y nsis

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/client

      - name: Download Windows backend
        uses: actions/download-artifact@v4
        with:
          name: backend-x86_64-pc-windows-msvc
          path: backends

      - name: Download shell binaries
        uses: actions/download-artifact@v4
        with:
          name: shell-binaries
          path: shells

      - name: Assemble Windows NSIS installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/assemble-windows-installer.sh \
            --shell-bin shells/windows/Koryphaios-shell-windows-x64.exe \
            --frontend frontend/build/client \
            --backend backends/koryphaios-backend-x86_64-pc-windows-msvc.exe \
            --config config \
            --icons desktop/src-tauri/icons/icon.ico \
            --version "$VERSION" \
            --output-dir artifacts

      - name: Verify installer
        run: |
          INSTALLER=$(find artifacts -name "*-x64-setup.exe" -print -quit)
          test -n "$INSTALLER"
          test "$(stat -c%s "$INSTALLER")" -gt 1000000
          echo "Installer size: $(stat -c%s "$INSTALLER") bytes"

      - name: Sign installer (if signing key available)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tauri's signer is used to create .sig files for the updater.
          # We sign the installer so the updater can verify integrity.
          INSTALLER=$(find artifacts -name "*-x64-setup.exe" -print -quit)
          npx @tauri-apps/cli signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --private-key-password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$INSTALLER" || echo "Signing skipped (signer not available)"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: artifacts/
          if-no-files-found: error

  # ─── Assemble macOS bundles (macOS runner, NO Rust compilation) ────────────
  assemble-macos:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 15
    needs: [build-frontend, build-backends, download-shells]
    if: needs.download-shells.outputs.shell-available == 'true'
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: aarch64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/client

      - name: Download macOS backend
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.target }}
          path: backends

      - name: Download shell binaries
        uses: actions/download-artifact@v4
        with:
          name: shell-binaries
          path: shells

      - name: Assemble macOS .app and DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/assemble-macos-bundle.sh \
            --shell-bin "shells/macos-${{ matrix.arch }}/Koryphaios-shell-macos-${{ matrix.arch }}" \
            --frontend frontend/build/client \
            --backend "backends/koryphaios-backend-${{ matrix.target }}" \
            --config config \
            --icons desktop/src-tauri/icons/icon.icns \
            --version "$VERSION" \
            --arch "${{ matrix.arch }}" \
            --output-dir artifacts

      - name: Sign DMG for updater (if signing key available)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          DMG=$(find artifacts -name "*.dmg" -print -quit)
          npx @tauri-apps/cli signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --private-key-password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$DMG" || echo "Signing skipped (signer not available)"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error

  # ─── Assemble Linux packages (native, fast) ────────────────────────────────
  assemble-linux:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: [build-frontend, build-backends, download-shells]
    if: needs.download-shells.outputs.shell-available == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            desktop-file-utils \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: shell-linux-x64

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/client

      - name: Download Linux backend
        uses: actions/download-artifact@v4
        with:
          name: backend-x86_64-unknown-linux-gnu
          path: desktop/src-tauri/embedded-backend

      - name: Build Tauri app (Linux native — shell is cached)
        working-directory: ./desktop
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify Linux artifacts
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          DEB_COUNT=$(find "$BUNDLE_DIR/deb" -name "*.deb" 2>/dev/null | wc -l)
          RPM_COUNT=$(find "$BUNDLE_DIR/rpm" -name "*.rpm" 2>/dev/null | wc -l)
          APPIMAGE_COUNT=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" 2>/dev/null | wc -l)
          echo "Artifacts: deb=$DEB_COUNT rpm=$RPM_COUNT appimage=$APPIMAGE_COUNT"
          if [ "$DEB_COUNT" -eq 0 ] || [ "$RPM_COUNT" -eq 0 ] || [ "$APPIMAGE_COUNT" -eq 0 ]; then
            echo "ERROR: Linux release requires DEB, RPM, and AppImage artifacts"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: linux-installer
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ─── Assemble macOS universal DMG (from per-arch DMGs) ─────────────────────
  assemble-macos-universal:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 10
    needs: [assemble-macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6

      - name: Download both arch DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: macos-installer-*
          path: dmg-sources
          merge-multiple: false

      - name: Create universal DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Find the .app bundles from each arch
          X86_APP=$(find dmg-sources/macos-installer-x86_64 -name "Koryphaios.app" -type d | head -1)
          ARM_APP=$(find dmg-sources/macos-installer-aarch64 -name "Koryphaios.app" -type d | head -1)
          test -d "$X86_APP" || { echo "No x86_64 .app found"; exit 1; }
          test -d "$ARM_APP" || { echo "No aarch64 .app found"; exit 1; }

          # Create universal binary by merging the two shell executables
          UNIVERSAL_APP="artifacts/Koryphaios.app"
          mkdir -p "$(dirname "$UNIVERSAL_APP")"
          cp -R "$ARM_APP" "$UNIVERSAL_APP"

          # lipo the two shell binaries together
          lipo -create \
            "$X86_APP/Contents/MacOS/Koryphaios" \
            "$ARM_APP/Contents/MacOS/Koryphaios" \
            -output "$UNIVERSAL_APP/Contents/MacOS/Koryphaios"

          # Also lipo the backend binaries
          lipo -create \
            "$X86_APP/Contents/Resources/backend/koryphaios-backend-x86_64-apple-darwin" \
            "$ARM_APP/Contents/Resources/backend/koryphaios-backend-aarch64-apple-darwin" \
            -output "$UNIVERSAL_APP/Contents/Resources/backend/koryphaios-backend-universal"

          # Remove the per-arch backends, keep only universal
          rm -f "$UNIVERSAL_APP/Contents/Resources/backend/koryphaios-backend-x86_64-apple-darwin"
          rm -f "$UNIVERSAL_APP/Contents/Resources/backend/koryphaios-backend-aarch64-apple-darwin"

          # Re-sign the universal bundle
          SIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          codesign --force --deep --strict --sign "$SIGN_IDENTITY" "$UNIVERSAL_APP"
          codesign --verify --deep --strict --verbose=2 "$UNIVERSAL_APP"

          # Create universal DMG
          DMG_STAGING=$(mktemp -d)
          ln -s /Applications "$DMG_STAGING/Applications"
          cp -R "$UNIVERSAL_APP" "$DMG_STAGING/"

          hdiutil create \
            -volname "Koryphaios" \
            -srcfolder "$DMG_STAGING" \
            -ov -format UDZO \
            "artifacts/Koryphaios-${VERSION}-universal.dmg"

          rm -rf "$DMG_STAGING"
          echo "Universal DMG created"
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal-installer
          path: artifacts/
          if-no-files-found: error

  # ─── Publish release ───────────────────────────────────────────────────────
  publish-release:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [assemble-windows, assemble-macos, assemble-linux, assemble-macos-universal]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish verified installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' ASSETS < <(find release-artifacts -type f \( \
            -name '*.dmg' -o -name '*.dmg.sig' -o \
            -name '*.msi' -o -name '*.msi.sig' -o \
            -name '*.exe' -o -name '*.exe.sig' -o \
            -name '*.deb' -o -name '*.rpm' -o \
            -name '*.AppImage' -o -name '*.AppImage.sig' \
          \) -print0)
          test "${#ASSETS[@]}" -gt 0
          printf 'Publishing %s verified release assets\n' "${#ASSETS[@]}"
          gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo Sylorlabs/Koryphaios

  # ─── Generate updater manifest (latest.json) ───────────────────────────────
  publish-updater-manifest:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [publish-release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate latest.json from release .sig files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          REPO="Sylorlabs/Koryphaios"
          VERSION="${TAG#v}"
          mkdir -p sigs
          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir sigs || true

          PLATFORMS='{}'
          for sig_file in sigs/*.sig; do
            [ -f "$sig_file" ] || continue
            sig_content=$(cat "$sig_file")
            base_name=$(basename "$sig_file" .sig)
            url="https://github.com/$REPO/releases/download/$TAG/$base_name"
            platform=""
            case "$base_name" in
              *aarch64*.dmg)        platform="darwin-aarch64" ;;
              *universal*.dmg)      platform="darwin-universal" ;;
              *x86_64*.dmg|*x64*.dmg) platform="darwin-x86_64" ;;
              *amd64*.AppImage|*x86_64*.AppImage) platform="linux-x86_64" ;;
              *x64-setup*.exe|*-setup*.exe) platform="windows-x86_64" ;;
              *) echo "::warning::Unknown platform for $base_name, skipping"; continue ;;
            esac
            if [[ "$platform" == "windows-x86_64" && "$base_name" == *.msi ]]; then
              if ls sigs/*-setup.exe.sig 1>/dev/null 2>&1; then continue; fi
            fi
            echo "Mapping: $base_name -> $platform"
            PLATFORMS=$(echo "$PLATFORMS" | jq \
              --arg p "$platform" --arg s "$sig_content" --arg u "$url" \
              '.[$p] = {signature: $s, url: $u}')
          done

          RELEASE_INFO=$(gh release view "$TAG" --repo "$REPO" --json body,createdAt)
          NOTES=$(echo "$RELEASE_INFO" | jq -r '.body // "Release $VERSION"')
          PUB_DATE=$(echo "$RELEASE_INFO" | jq -r '.createdAt')

          jq -n \
            --arg version "$VERSION" --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json

          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo Sylorlabs/Koryphaios

  # ─── Summary ───────────────────────────────────────────────────────────────
  release-summary:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [assemble-windows, assemble-macos, assemble-linux, assemble-macos-universal, publish-release, publish-updater-manifest]
    if: always()
    steps:
      - name: Release Summary
        run: |
          echo "Release Status Summary:"
          echo "========================"
          echo "Frontend:       ${{ needs.build-frontend.result }}"
          echo "Backends:       ${{ needs.build-backends.result }}"
          echo "Shell download: ${{ needs.download-shells.result }}"
          echo "Windows:        ${{ needs.assemble-windows.result }}"
          echo "macOS x86_64:   ${{ needs.assemble-macos.result }}"
          echo "Linux:          ${{ needs.assemble-linux.result }}"
          echo "macOS universal: ${{ needs.assemble-macos-universal.result }}"
          echo "Publish:        ${{ needs.publish-release.result }}"
          echo "Updater manifest: ${{ needs.publish-updater-manifest.result }}"
