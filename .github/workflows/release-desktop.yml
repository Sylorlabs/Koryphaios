name: Release Desktop Apps

# Release invariant:
#   - the workflow must run on an immutable v* tag
#   - every updater artifact must be signed
#   - cached native shells must come from one explicit successful build-shell run
#   - assets are assembled into a draft release
#   - the draft becomes public only after every platform and latest.json verify

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.14'

permissions:
  contents: write
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      shell-run-id: ${{ steps.release.outputs.shell_run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release inputs and immutable version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SHELL_BUILD_RUN_ID: ${{ vars.SHELL_BUILD_RUN_ID }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Release workflow must run on a v* tag, got $GITHUB_REF"; exit 1 ;;
          esac

          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          CONFIG_VERSION=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          if [ "$CONFIG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match Tauri version $CONFIG_VERSION"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for a stable release"
            exit 1
          fi
          if ! printf '%s' "$SHELL_BUILD_RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error::SHELL_BUILD_RUN_ID must identify the successful build-shell workflow run"
            exit 1
          fi

          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SHELL_BUILD_RUN_ID")
          CONCLUSION=$(echo "$RUN" | jq -r .conclusion)
          WORKFLOW_PATH=$(echo "$RUN" | jq -r .path)
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Shell workflow run $SHELL_BUILD_RUN_ID concluded $CONCLUSION"
            exit 1
          fi
          if [ "$WORKFLOW_PATH" != ".github/workflows/build-shell.yml" ]; then
            echo "::error::Run $SHELL_BUILD_RUN_ID belongs to $WORKFLOW_PATH, not build-shell.yml"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "shell_run_id=$SHELL_BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Release preflight passed for $TAG using shell run $SHELL_BUILD_RUN_ID"

  prepare-release:
    runs-on: ubuntu-latest
    needs: [preflight]
    timeout-minutes: 5
    steps:
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG is already public; published releases are immutable"
              exit 1
            fi
            echo "Reusing existing draft release $TAG"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Koryphaios $TAG"
          fi

  build-frontend:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [preflight]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build frontend
        working-directory: ./frontend
        run: bun run build
        env:
          BUILD_MODE: static
          NODE_ENV: production
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build/client
          if-no-files-found: error
          retention-days: 1

  build-backends:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [build-frontend]
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            bun-target: bun-windows-x64
            suffix: .exe
          - target: x86_64-apple-darwin
            bun-target: bun-darwin-x64
            suffix: ''
          - target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
            suffix: ''
          - target: x86_64-unknown-linux-gnu
            bun-target: bun-linux-x64
            suffix: ''
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Compile backend for ${{ matrix.target }}
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          set -euo pipefail
          OUTFILE="$GITHUB_WORKSPACE/koryphaios-backend-${{ matrix.target }}${{ matrix.suffix }}"
          DEFINE=()
          [ -n "$RELAY_URL" ] && DEFINE+=(--define "process.env.RELAY_URL=\"$RELAY_URL\"")
          bun build --compile --target=${{ matrix.bun-target }} "${DEFINE[@]}" \
            backend/src/server.ts --outfile="$OUTFILE"
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            gzip -9 -c "$OUTFILE" > "$OUTFILE.gz"
            rm "$OUTFILE"
          fi
          test -s "$OUTFILE" || test -s "$OUTFILE.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.target }}
          path: koryphaios-backend-${{ matrix.target }}${{ matrix.suffix }}*
          if-no-files-found: error
          retention-days: 1

  download-shells:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: [preflight]
    steps:
      - name: Download Windows shell from pinned build run
        uses: actions/download-artifact@v4
        with:
          name: shell-windows-x64
          path: shells/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.shell-run-id }}
      - name: Download macOS x86_64 shell from pinned build run
        uses: actions/download-artifact@v4
        with:
          name: shell-macos-x86_64
          path: shells/macos-x86_64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.shell-run-id }}
      - name: Download macOS aarch64 shell from pinned build run
        uses: actions/download-artifact@v4
        with:
          name: shell-macos-aarch64
          path: shells/macos-aarch64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.shell-run-id }}
      - name: Download Linux shell provenance artifact
        uses: actions/download-artifact@v4
        with:
          name: shell-linux-x64
          path: shells/linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.shell-run-id }}
      - name: Verify exact shell payloads
        run: |
          set -euo pipefail
          test -s shells/windows/Koryphaios-shell-windows-x64.exe
          test -s shells/macos-x86_64/Koryphaios-shell-macos-x86_64
          test -s shells/macos-aarch64/Koryphaios-shell-macos-aarch64
          test -s shells/linux/Koryphaios-shell-linux-x64
          sha256sum shells/windows/* shells/macos-x86_64/* shells/macos-aarch64/* shells/linux/*
      - uses: actions/upload-artifact@v7
        with:
          name: shell-binaries
          path: shells/
          if-no-files-found: error
          retention-days: 1

  assemble-windows:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: [preflight, build-frontend, build-backends, download-shells]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/client
      - uses: actions/download-artifact@v4
        with:
          name: backend-x86_64-pc-windows-msvc
          path: backends
      - uses: actions/download-artifact@v4
        with:
          name: shell-binaries
          path: shells
      - name: Assemble Windows NSIS installer
        run: |
          ./scripts/assemble-windows-installer.sh \
            --shell-bin shells/windows/Koryphaios-shell-windows-x64.exe \
            --frontend frontend/build/client \
            --backend backends/koryphaios-backend-x86_64-pc-windows-msvc.exe \
            --config config \
            --icons desktop/src-tauri/icons/icon.ico \
            --version "${{ needs.preflight.outputs.version }}" \
            --output-dir artifacts
      - name: Verify and sign Windows updater installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          INSTALLER=$(find artifacts -name "*-x64-setup.exe" -print -quit)
          test -n "$INSTALLER"
          test "$(stat -c%s "$INSTALLER")" -gt 1000000
          npx @tauri-apps/cli signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --private-key-password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$INSTALLER"
          test -s "$INSTALLER.sig"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: artifacts/
          if-no-files-found: error

  assemble-macos:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 15
    needs: [preflight, build-frontend, build-backends, download-shells]
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: aarch64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/client
      - uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.target }}
          path: backends
      - uses: actions/download-artifact@v4
        with:
          name: shell-binaries
          path: shells
      - name: Assemble macOS app and DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          ./scripts/assemble-macos-bundle.sh \
            --shell-bin "shells/macos-${{ matrix.arch }}/Koryphaios-shell-macos-${{ matrix.arch }}" \
            --frontend frontend/build/client \
            --backend "backends/koryphaios-backend-${{ matrix.target }}" \
            --config config \
            --icons desktop/src-tauri/icons/icon.icns \
            --version "${{ needs.preflight.outputs.version }}" \
            --arch "${{ matrix.arch }}" \
            --output-dir artifacts
      - name: Verify and sign macOS updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TARGZ=$(find artifacts -name "*.app.tar.gz" -print -quit)
          DMG=$(find artifacts -name "*.dmg" -print -quit)
          test -s "$TARGZ"
          test -s "$DMG"
          npx @tauri-apps/cli signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --private-key-password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$TARGZ"
          test -s "$TARGZ.sig"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error

  assemble-linux:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: [preflight, build-frontend, build-backends, download-shells]
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf rpm \
            desktop-file-utils libgtk-3-dev libayatana-appindicator3-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: shell-linux-x64
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/client
      - uses: actions/download-artifact@v4
        with:
          name: backend-x86_64-unknown-linux-gnu
          path: desktop/src-tauri/embedded-backend
      - name: Build signed Linux bundles
        working-directory: ./desktop
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify Linux packages and updater signature
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          test "$(find "$BUNDLE_DIR/deb" -name '*.deb' | wc -l)" -gt 0
          test "$(find "$BUNDLE_DIR/rpm" -name '*.rpm' | wc -l)" -gt 0
          test "$(find "$BUNDLE_DIR/appimage" -name '*.AppImage' | wc -l)" -gt 0
          test "$(find "$BUNDLE_DIR/appimage" -name '*.AppImage.sig' | wc -l)" -gt 0
      - uses: actions/upload-artifact@v7
        with:
          name: linux-installer
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/deb/*.deb.sig
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/rpm/*.rpm.sig
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  assemble-macos-universal:
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 10
    needs: [preflight, assemble-macos]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-installer-*
          path: dmg-sources
          merge-multiple: false
      - name: Create universal DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          X86_APP=$(find dmg-sources/macos-installer-x86_64 -name "Koryphaios.app" -type d | head -1)
          ARM_APP=$(find dmg-sources/macos-installer-aarch64 -name "Koryphaios.app" -type d | head -1)
          test -d "$X86_APP"
          test -d "$ARM_APP"

          UNIVERSAL_APP="artifacts/Koryphaios.app"
          mkdir -p "$(dirname "$UNIVERSAL_APP")"
          cp -R "$ARM_APP" "$UNIVERSAL_APP"
          lipo -create \
            "$X86_APP/Contents/MacOS/Koryphaios" \
            "$ARM_APP/Contents/MacOS/Koryphaios" \
            -output "$UNIVERSAL_APP/Contents/MacOS/Koryphaios"
          lipo -create \
            "$X86_APP/Contents/Resources/backend/koryphaios-backend-x86_64-apple-darwin" \
            "$ARM_APP/Contents/Resources/backend/koryphaios-backend-aarch64-apple-darwin" \
            -output "$UNIVERSAL_APP/Contents/Resources/backend/koryphaios-backend-universal"
          rm -f "$UNIVERSAL_APP/Contents/Resources/backend/koryphaios-backend-x86_64-apple-darwin"
          rm -f "$UNIVERSAL_APP/Contents/Resources/backend/koryphaios-backend-aarch64-apple-darwin"

          SIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          codesign --force --deep --strict --sign "$SIGN_IDENTITY" "$UNIVERSAL_APP"
          codesign --verify --deep --strict --verbose=2 "$UNIVERSAL_APP"

          DMG_STAGING=$(mktemp -d)
          trap 'rm -rf "$DMG_STAGING"' EXIT
          ln -s /Applications "$DMG_STAGING/Applications"
          cp -R "$UNIVERSAL_APP" "$DMG_STAGING/"
          hdiutil create \
            -volname "Koryphaios" \
            -srcfolder "$DMG_STAGING" \
            -ov -format UDZO \
            "artifacts/Koryphaios-${VERSION}-universal.dmg"
          test -s "artifacts/Koryphaios-${VERSION}-universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal-installer
          path: artifacts/
          if-no-files-found: error

  publish-release-assets:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs:
      [
        preflight,
        prepare-release,
        assemble-windows,
        assemble-macos,
        assemble-linux,
        assemble-macos-universal,
      ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Validate and upload draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -d '' ASSETS < <(find release-artifacts -type f \( \
            -name '*.dmg' -o -name '*.dmg.sig' -o \
            -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o \
            -name '*.msi' -o -name '*.msi.sig' -o \
            -name '*.exe' -o -name '*.exe.sig' -o \
            -name '*.deb' -o -name '*.deb.sig' -o \
            -name '*.rpm' -o -name '*.rpm.sig' -o \
            -name '*.AppImage' -o -name '*.AppImage.sig' \
          \) -print0)
          test "${#ASSETS[@]}" -gt 0
          test "$(find release-artifacts -name '*-setup.exe.sig' | wc -l)" -gt 0
          test "$(find release-artifacts -name '*aarch64*.app.tar.gz.sig' | wc -l)" -gt 0
          test "$(find release-artifacts -name '*x86_64*.app.tar.gz.sig' | wc -l)" -gt 0
          test "$(find release-artifacts -name '*.AppImage.sig' | wc -l)" -gt 0
          gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  publish-updater-manifest:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: [preflight, publish-release-assets]
    steps:
      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          VERSION="${TAG#v}"
          mkdir -p sigs
          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir sigs

          PLATFORMS='{}'
          for sig_file in sigs/*.sig; do
            sig_content=$(cat "$sig_file")
            base_name=$(basename "$sig_file" .sig)
            url="https://github.com/$REPO/releases/download/$TAG/$base_name"
            platform=""
            case "$base_name" in
              *aarch64*.app.tar.gz) platform="darwin-aarch64" ;;
              *x86_64*.app.tar.gz|*x64*.app.tar.gz) platform="darwin-x86_64" ;;
              *amd64*.AppImage|*x86_64*.AppImage) platform="linux-x86_64" ;;
              *x64-setup*.exe|*-setup*.exe) platform="windows-x86_64" ;;
              *.dmg) continue ;;
              *.msi)
                if ls sigs/*-setup.exe.sig >/dev/null 2>&1; then continue; fi
                platform="windows-x86_64"
                ;;
              *) continue ;;
            esac
            PLATFORMS=$(echo "$PLATFORMS" | jq \
              --arg p "$platform" --arg s "$sig_content" --arg u "$url" \
              '.[$p] = {signature: $s, url: $u}')
          done

          for required in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            if [ "$(echo "$PLATFORMS" | jq --arg p "$required" 'has($p)')" != "true" ]; then
              echo "::error::Missing required updater platform $required"
              exit 1
            fi
          done

          RELEASE_INFO=$(gh release view "$TAG" --repo "$REPO" --json body,createdAt,isDraft)
          [ "$(echo "$RELEASE_INFO" | jq -r .isDraft)" = "true" ]
          NOTES=$(echo "$RELEASE_INFO" | jq -r '.body // "Release"')
          PUB_DATE=$(echo "$RELEASE_INFO" | jq -r .createdAt)
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json
          jq -e \
            '.version and (.platforms | keys | length == 4) and ([.platforms[].signature | length > 0] | all)' \
            latest.json >/dev/null
          gh release upload "$TAG" latest.json --clobber --repo "$REPO"

  publish-stable-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [preflight, publish-updater-manifest]
    steps:
      - name: Publish verified draft atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx false
          echo "Published $TAG after all artifact and updater checks passed"

  release-summary:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - preflight
      - prepare-release
      - build-frontend
      - build-backends
      - download-shells
      - assemble-windows
      - assemble-macos
      - assemble-linux
      - assemble-macos-universal
      - publish-release-assets
      - publish-updater-manifest
      - publish-stable-release
    steps:
      - name: Release summary
        run: |
          cat <<'SUMMARY'
          Release Status Summary
          ======================
          Preflight:        ${{ needs.preflight.result }}
          Draft release:    ${{ needs.prepare-release.result }}
          Frontend:         ${{ needs.build-frontend.result }}
          Backends:         ${{ needs.build-backends.result }}
          Shell provenance: ${{ needs.download-shells.result }}
          Windows:          ${{ needs.assemble-windows.result }}
          macOS:            ${{ needs.assemble-macos.result }}
          Linux:            ${{ needs.assemble-linux.result }}
          macOS universal:  ${{ needs.assemble-macos-universal.result }}
          Asset upload:     ${{ needs.publish-release-assets.result }}
          Updater manifest: ${{ needs.publish-updater-manifest.result }}
          Stable publish:   ${{ needs.publish-stable-release.result }}
          SUMMARY
