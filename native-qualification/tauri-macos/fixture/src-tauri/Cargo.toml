[package]
name = "kory-tauri-v5-scenario2"
version = "0.1.0"
edition = "2021"
description = "Disposable native Tauri dialog/IPC qualification fixture"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
tokio = { version = "1", features = ["sync"] }
